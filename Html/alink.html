<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单 · HTML链接生成器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.15);
            padding: 28px 32px;
        }
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.75rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h2 svg {
            opacity: 0.7;
        }
        h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 24px 0 12px 0;
            color: #334155;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        .items-panel {
            background: #f8fafc;
            border-radius: 18px;
            padding: 16px 12px;
            border: 1px solid #e2e8f0;
        }
        .link-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            background: white;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #e9eef2;
            transition: all 0.15s;
        }
        .link-row:hover {
            border-color: #b9d1fb;
            box-shadow: 0 4px 10px rgba(0, 100, 255, 0.08);
        }
        .field {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
        }
        .field label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            font-size: 0.95rem;
            background: white;
            transition: 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .field input[readonly] {
            background: #f1f5f9;
            cursor: default;
        }
        .delete-btn {
            background: none;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 18px;
            font-weight: 500;
            color: #94a3b8;
            width: 42px;
            height: 42px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 20px; /* 与label对齐微调 */
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .delete-btn:hover {
            background: #fee2e2;
            border-color: #f87171;
            color: #b91c1c;
        }
        .add-btn {
            background: white;
            border: 2px dashed #cbd5e1;
            color: #1e293b;
            font-weight: 500;
            padding: 14px 20px;
            border-radius: 40px;
            width: 100%;
            font-size: 1rem;
            margin-top: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.15s;
        }
        .add-btn:hover {
            background: #f0f9ff;
            border-color: #3b82f6;
            color: #1e4f9e;
        }
        .output-area {
            background: #0f172a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #334155;
        }
        textarea {
            width: 100%;
            background: #1e293b;
            border: none;
            border-radius: 16px;
            padding: 20px;
            font-family: 'Fira Code', 'Menlo', 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
            resize: vertical;
            white-space: pre;
            overflow-x: auto;
            outline: 1px solid #3b4252;
        }
        textarea:focus {
            outline: 2px solid #3b82f6;
        }
        .copy-hint {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 10px;
            color: #a0afc0;
            font-size: 0.85rem;
            gap: 6px;
        }
        .footer-note {
            font-size: 0.8rem;
            color: #6b7a8f;
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>
        ⚙️ 菜单链接生成器
        <span style="font-size: 0.9rem; font-weight: 400; color: #64748b; margin-left: auto;">可视化配置 · 实时输出</span>
    </h2>
    
    <!-- 配置区域 -->
    <div class="items-panel" id="itemsPanel">
        <div id="linksContainer"></div>
        <button class="add-btn" id="addLinkBtn">
            <span style="font-size:1.4rem;">+</span> 添加新链接
        </button>
    </div>

    <!-- 实时HTML预览 -->
    <h3>📋 生成的 HTML (可复制)</h3>
    <div class="output-area">
        <textarea id="htmlOutput" readonly wrap="off" placeholder="&lt;a href=&quot;...&quot;&gt;...&lt;/a&gt;"></textarea>
        <div class="copy-hint">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>直接复制上方代码，粘贴即用</span>
        </div>
    </div>
    <div class="footer-note">
        ⚡ 每个链接独立配置 · 修改即时更新
    </div>
</div>

<script>
    (function() {
        // ----- 数据源：每个链接对象 { url: "", text: "" } -----
        let linksData = [
            { url: "https://qq.com", text: "11111111111" },
            { url: "https://baidu.com", text: "11111111111" }
        ];

        // 获取容器
        const container = document.getElementById('linksContainer');
        const outputTextarea = document.getElementById('htmlOutput');
        const addBtn = document.getElementById('addLinkBtn');

        // ----- 工具函数：转义HTML特殊字符 (防止生成的HTML语法错误 & 保证显示正确) -----
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"]/g, function(match) {
                if (match === '&') return '&amp;';
                if (match === '<') return '&lt;';
                if (match === '>') return '&gt;';
                if (match === '"') return '&quot;';
                return match;
            });
        }

        // ----- 更新输出区 (生成转义后的HTML代码) -----
        function updateOutput() {
            // 生成每一行的 <a href="...">...</a>  并对url和text分别转义
            const htmlLines = linksData.map(item => {
                const safeUrl = escapeHtml(item.url);
                const safeText = escapeHtml(item.text);
                return `<a href="${safeUrl}">${safeText}</a>`;
            });
            // 用换行连接，设置到textarea (纯文本，无需二次转义)
            outputTextarea.value = htmlLines.join('\n');
        }

        // ----- 渲染整个列表 (数据驱动) -----
        function renderList() {
            // 清空容器
            container.innerHTML = '';

            // 遍历linksData，为每一项创建编辑行
            linksData.forEach((link, index) => {
                const row = document.createElement('div');
                row.className = 'link-row';
                row.dataset.index = index;

                // --- URL 输入字段 ---
                const urlField = document.createElement('div');
                urlField.className = 'field';
                urlField.innerHTML = `<label>🔗 链接地址</label>`;
                const urlInput = document.createElement('input');
                urlInput.type = 'text';
                urlInput.value = link.url;
                urlInput.placeholder = 'https://example.com';
                urlInput.setAttribute('spellcheck', 'false');
                urlField.appendChild(urlInput);

                // --- 文本 输入字段 ---
                const textField = document.createElement('div');
                textField.className = 'field';
                textField.innerHTML = `<label>📝 菜单名</label>`;
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = link.text;
                textInput.placeholder = '链接文字';
                textField.appendChild(textInput);

                // --- 删除按钮 ---
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✕';
                delBtn.setAttribute('aria-label', '删除此链接');

                // 组装行
                row.appendChild(urlField);
                row.appendChild(textField);
                row.appendChild(delBtn);
                container.appendChild(row);

                // --- 绑定输入事件 (实时更新数据 + 刷新输出) ---
                urlInput.addEventListener('input', function(e) {
                    linksData[index].url = e.target.value;
                    updateOutput();
                });

                textInput.addEventListener('input', function(e) {
                    linksData[index].text = e.target.value;
                    updateOutput();
                });

                // --- 删除事件 ---
                delBtn.addEventListener('click', function() {
                    // 移除对应数据项
                    linksData.splice(index, 1);
                    // 重新渲染整个列表 (保证索引连续)
                    renderList();
                    updateOutput();
                });
            });

            // 每次渲染完确保输出是最新的 (比如删除后更新)
            updateOutput();
        }

        // ----- 新增链接 -----
        function addNewLink() {
            linksData.push({ url: '', text: '' });  // 新增一个空白链接
            renderList();  // 重新渲染 (保留已有数据)
        }

        // 监听添加按钮
        addBtn.addEventListener('click', addNewLink);

        // 初始化渲染
        renderList();

        // 附加：点击textarea自动全选（方便复制）
        outputTextarea.addEventListener('click', function() {
            this.select();
        });

        // 可选：添加一个键盘全选提示 (ctrl+a也可以)
    })();
</script>

<!-- 注：所有特殊字符都会自动转义，生成的代码可直接用于HTML文件 -->
</body>
</html>
